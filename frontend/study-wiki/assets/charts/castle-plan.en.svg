<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" font-family="Arial, 'Helvetica Neue', 'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif" font-size="11" fill="#202122">
<rect width="520" height="380" fill="#fff"/>
<text x="260" y="20" text-anchor="middle" font-size="13" font-weight="bold">Plan of Harukawa Castle</text><path d="M0 40 C 30 120, 10 250, 40 380 L0 380 Z" fill="#cfe3f5"/><text x="14" y="210" transform="rotate(-80 14 210)" fill="#1f6fb2" font-size="11">Kagami River</text><rect x="70" y="36" width="440" height="334" fill="#f3efe4" stroke="#b9ad8f"/><text x="500" y="360" text-anchor="end" fill="#8a7d5c" font-weight="bold">Sannomaru</text><rect x="140" y="44" width="300" height="12" fill="#9fc6ea"/><text x="290" y="70" text-anchor="middle" font-size="9.5" fill="#1f6fb2">Outer moat (surviving 600 m)</text><rect x="96" y="84" width="44" height="262" fill="#9fc6ea"/><text x="118" y="220" transform="rotate(-90 118 220)" text-anchor="middle" fill="#1f4f8a" font-size="10">West Moat (64 m)</text><rect x="140" y="84" width="320" height="262" fill="#9fc6ea"/><rect x="150" y="94" width="300" height="242" fill="#e9e2cc" stroke="#8a7d5c" stroke-width="2"/><text x="440" y="328" text-anchor="end" fill="#6b5f40" font-weight="bold">Ninomaru</text><rect x="190" y="120" width="190" height="150" fill="#9fc6ea"/><rect x="200" y="130" width="170" height="130" fill="#d8cfb0" stroke="#5b5035" stroke-width="2.5"/><text x="285" y="250" text-anchor="middle" fill="#4a4128" font-weight="bold">Honmaru</text><path d="M200 130 L240 130 M200 130 L200 170" stroke="#3a3020" stroke-width="6"/><text x="204" y="116" font-size="9.5">Byōbu Wall (21 m)</text><rect x="226" y="148" width="40" height="36" fill="#fff" stroke="#202122" stroke-width="2"/><text x="246" y="200" text-anchor="middle" font-size="10" font-weight="bold">Keep (1966)</text><rect x="352" y="244" width="18" height="16" fill="#c0392b"/><text x="392" y="288" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">Tatsumi Turret (1609)</text><rect x="290" y="326" width="28" height="20" fill="#c0392b"/><text x="304" y="362" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">Sagimai Gate (1757)</text><rect x="168" y="290" width="70" height="30" fill="none" stroke="#8a7d5c" stroke-dasharray="4 3"/><text x="203" y="309" text-anchor="middle" font-size="9.5">Domain kiln site</text><rect x="390" y="110" width="50" height="40" fill="none" stroke="#8a7d5c" stroke-dasharray="4 3"/><text x="415" y="134" text-anchor="middle" font-size="9.5">Palace site</text><rect x="76" y="352" width="60" height="14" fill="#7f8c8d"/><text x="160" y="336" text-anchor="middle" font-size="9.5">Museum of Art</text><path d="M140 340 L112 352" stroke="#7f8c8d"/><path d="M490 70 L490 50 M484 58 L490 48 L496 58" stroke="#202122" stroke-width="1.5" fill="none"/><text x="490" y="84" text-anchor="middle" font-weight="bold">N</text><text x="80" y="376" font-size="9" fill="#c0392b">Red: surviving original buildings</text>
