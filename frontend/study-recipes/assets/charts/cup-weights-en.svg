<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 415" width="680" height="415" font-family="Helvetica, Arial, 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" ><rect width="680" height="415" fill="#fff"/><text x="16" y="28" font-size="17" font-weight="bold" fill="#3d3a35">Weight of 1 US cup (240 ml)</text><line x1="200" x2="200" y1="44" y2="375" stroke="#ece6dc"/><text x="200" y="391" font-size="10.5" fill="#8a847b" text-anchor="middle">0 g</text><line x1="260" x2="260" y1="44" y2="375" stroke="#ece6dc"/><text x="260" y="391" font-size="10.5" fill="#8a847b" text-anchor="middle">50 g</text><line x1="320" x2="320" y1="44" y2="375" stroke="#ece6dc"/><text x="320" y="391" font-size="10.5" fill="#8a847b" text-anchor="middle">100 g</text><line x1="380" x2="380" y1="44" y2="375" stroke="#ece6dc"/><text x="380" y="391" font-size="10.5" fill="#8a847b" text-anchor="middle">150 g</text><line x1="440" x2="440" y1="44" y2="375" stroke="#ece6dc"/><text x="440" y="391" font-size="10.5" fill="#8a847b" text-anchor="middle">200 g</text><line x1="500" x2="500" y1="44" y2="375" stroke="#ece6dc"/><text x="500" y="391" font-size="10.5" fill="#8a847b" text-anchor="middle">250 g</text><line x1="560" x2="560" y1="44" y2="375" stroke="#ece6dc"/><text x="560" y="391" font-size="10.5" fill="#8a847b" text-anchor="middle">300 g</text><line x1="620" x2="620" y1="44" y2="375" stroke="#ece6dc"/><text x="620" y="391" font-size="10.5" fill="#8a847b" text-anchor="middle">350 g</text><text x="190" y="65" font-size="12.5" fill="#3d3a35" text-anchor="end">Panko</text><rect x="200" y="53" width="60" height="17" fill="#d9775f" rx="2"/><text x="266" y="65" font-size="12" font-weight="bold" fill="#3d3a35">50 g</text><text x="190" y="90" font-size="12.5" fill="#3d3a35" text-anchor="end">Rolled oats</text><rect x="200" y="78" width="108" height="17" fill="#c8553d" rx="2"/><text x="314" y="90" font-size="12" font-weight="bold" fill="#3d3a35">90 g</text><text x="190" y="115" font-size="12.5" fill="#3d3a